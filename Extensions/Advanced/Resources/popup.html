<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenBlock</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icon-48.png" width="24" height="24" alt="">
    <h1>OpenBlock</h1>
    <span id="status" class="status">…</span>
  </header>

  <main>
    <p id="hostname" class="hostname">…</p>
    <p id="detail" class="detail"></p>

    <label class="toggle" id="toggle-row">
      <span data-i18n="popup_pause_site">Pause on this site</span>
      <input type="checkbox" id="pause">
      <span class="switch" aria-hidden="true"></span>
    </label>
  </main>

  <footer>
    <span id="rules" class="rules"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
