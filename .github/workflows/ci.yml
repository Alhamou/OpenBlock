name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  core-tests:
    name: BlockerCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/BlockerCore

  web-extension:
    name: Web extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: WebExtension
      - run: npm test
        working-directory: WebExtension

  app-build:
    name: App build (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project OpenBlock.xcodeproj -scheme OpenBlock -configuration Release \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" \
            -derivedDataPath build/DerivedData build | tail -40
